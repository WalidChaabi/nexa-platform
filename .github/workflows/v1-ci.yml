name: V1 CI

on:
  push:
    branches: [main, 'v1/**']
    paths:
      - 'legacy/v1/**'
      - '.github/workflows/v1-ci.yml'
  pull_request:
    paths:
      - 'legacy/v1/**'
      - '.github/workflows/v1-ci.yml'

jobs:
  test:
    name: PHPUnit (legacy/v1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy/v1

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: sherin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php -r "file_put_contents('.env', PHP_EOL.'DB_CONNECTION=mysql'.PHP_EOL.'DB_HOST=127.0.0.1'.PHP_EOL.'DB_PORT=3306'.PHP_EOL.'DB_DATABASE=sherin_test'.PHP_EOL.'DB_USERNAME=root'.PHP_EOL.'DB_PASSWORD=password', FILE_APPEND);"

      - name: Run tests
        run: php artisan test || vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sherin_test
          DB_USERNAME: root
          DB_PASSWORD: password
