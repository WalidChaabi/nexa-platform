name: V2 CI

on:
  push:
    branches: [main, 'v2/**']
    paths:
      - 'apps/sherin-api/**'
      - 'apps/sherin-web/**'
      - '.github/workflows/v2-ci.yml'
  pull_request:
    paths:
      - 'apps/sherin-api/**'
      - 'apps/sherin-web/**'
      - '.github/workflows/v2-ci.yml'

jobs:
  api:
    name: Sherin API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sherin-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  web:
    name: Sherin Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sherin-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/sherin-web/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run lint
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
