# Sherin V2 local stack: MySQL + Laravel API + Next.js web UI.
services:
  database:
    image: mysql:8.0
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: sherin_test
      MYSQL_USER: me
      MYSQL_PASSWORD: ok
      MYSQL_ROOT_PASSWORD: ok
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./apps/sherin-api
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    environment:
      APP_NAME: SherinAPI
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: sherin_test
      DB_USERNAME: me
      DB_PASSWORD: ok
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - ./apps/sherin-api:/var/www/html
      - api-vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ./apps/sherin-web
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./apps/sherin-web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    depends_on:
      - api

volumes:
  db-data:
  api-vendor:
  web-node-modules:
  web-next:
