version: "3.8"

# Shared MySQL for legacy/v1 and apps/sherin-api local development.
services:
  database:
    image: mysql:8.0
    ports:
      - 3306:3306
    environment:
      - MYSQL_DATABASE=sherin_test
      - MYSQL_USER=me
      - MYSQL_PASSWORD=ok
      - MYSQL_ROOT_PASSWORD=ok
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
